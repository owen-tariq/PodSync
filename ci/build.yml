name: Build PodSync

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build, Test & Package (macOS)
    runs-on: macos-15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Swift version
        run: swift --version

      - name: Build (release)
        run: |
          set -o pipefail
          swift build -c release 2>&1 | tee build.log

      - name: Run tests
        run: |
          set -o pipefail
          swift test 2>&1 | tee test.log

      - name: Package PodSync.app
        run: CI=1 bash build_app.sh

      - name: Create DMG
        run: |
          mkdir -p dist/dmg
          cp -R PodSync.app dist/dmg/
          ln -s /Applications dist/dmg/Applications
          hdiutil create -volname "PodSync" -srcfolder dist/dmg -ov -format UDZO dist/PodSync.dmg

      - name: Upload DMG artifact
        uses: actions/upload-artifact@v4
        with:
          name: PodSync-dmg
          path: dist/PodSync.dmg

      - name: Upload app bundle artifact
        uses: actions/upload-artifact@v4
        with:
          name: PodSync-app
          path: PodSync.app

      - name: Publish logs to ci-logs branch
        if: always()
        run: |
          mkdir -p /tmp/cilogs
          cp build.log /tmp/cilogs/ 2>/dev/null || true
          cp test.log /tmp/cilogs/ 2>/dev/null || true
          cd /tmp/cilogs
          git init -q -b ci-logs
          git config user.email "ci@podsync"
          git config user.name "PodSync CI"
          echo "run: ${{ github.run_id }}" > meta.txt
          echo "sha: ${{ github.sha }}" >> meta.txt
          echo "conclusion: ${{ job.status }}" >> meta.txt
          git add -A
          git commit -q -m "logs for run ${{ github.run_id }} (${{ job.status }})"
          git push -q -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" ci-logs:ci-logs

      - name: Publish GitHub Release (main only)
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          NOTES="PodSync v2.0.0 — Podcast manager (search/subscribe/download/retention), playlists + smart playlists, Spotify-style auto mixes from your listening history, Genius mix, on-device metadata editing with batch edit, artwork lookup + configurable artwork resize, persistent library folders, sync plan preview, multi-format conversion (FLAC/WAV/AIFF built-in; OGG/Opus/WMA + MP3 via ffmpeg), sortable columns, Settings window."
          gh release create v2.0.0 --title "PodSync v2.0.0" --notes "$NOTES" dist/PodSync.dmg \
            || gh release upload v2.0.0 dist/PodSync.dmg --clobber
