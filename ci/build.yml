name: Build PodSync

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    name: Build, Test & Package (macOS)
    runs-on: macos-15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Swift version
        run: swift --version

      - name: Build (release)
        run: swift build -c release

      - name: Run tests
        run: swift test

      - name: Package PodSync.app
        run: CI=1 bash build_app.sh

      - name: Create DMG
        run: |
          mkdir -p dist/dmg
          cp -R PodSync.app dist/dmg/
          ln -s /Applications dist/dmg/Applications
          hdiutil create -volname "PodSync" -srcfolder dist/dmg -ov -format UDZO dist/PodSync.dmg

      - name: Upload DMG artifact
        uses: actions/upload-artifact@v4
        with:
          name: PodSync-dmg
          path: dist/PodSync.dmg

      - name: Upload app bundle artifact
        uses: actions/upload-artifact@v4
        with:
          name: PodSync-app
          path: PodSync.app
